<!--este componente contendrá tanto la barra de navegación 
como el área de trabajo dinámico-->
<div class="main">  
    <nav class="manuLateralNav">
        
        @if (permisos.puedeLeerModulo('FARMACIA')) {
            <div class="option" routerLink="/farmacia" routerLinkActive="active">
                <div class="barra"></div>
                <div class="foco">
                    <i class="bi bi-capsule"></i>
                </div>
            </div>
        }

        @if (permisos.puedeLeerModulo('PACIENTES')) {
            <div class="option" routerLink="/pacientes" routerLinkActive="active">
                <div class="barra"></div>
                <div class="foco">
                    <i class="bi bi-person-vcard"></i>
                </div>
            </div>
        }
    
        @if (permisos.puedeLeerModulo('MEDICA')) {
            <div class="option" routerLink="/medica" routerLinkActive="active">
                <div class="barra"></div>
                <div class="foco">
                    <i class="bi bi-heart-pulse"></i>
                </div>
            </div>
        }
        
        @if (permisos.puedeLeerModulo('ENFERMERIA')) {
            <div class="option" routerLink="/enfermeria" routerLinkActive="active">
                <div class="barra"></div>
                <div class="foco">
                    <i class="bi bi-clipboard2-pulse"></i>
                </div>
            </div>
        }

        @if (permisos.tieneAlgunCatalogo()) {
            <div class="option" routerLink="/catalogos" routerLinkActive="active">
                <div class="barra"></div>
                <div class="foco">
                    <i class="bi bi-grid-3x3-gap"></i>
                </div>
            </div>
        }
    
        @if (permisos.puedeLeerModulo('USUARIOS')) {
            <div class="option" routerLink="/usuarios" routerLinkActive="active">
                <div class="barra"></div>
                <div class="foco">
                    <i class="bi bi-person-circle"></i>
                </div>
            </div>
        }

        <div class="option" routerLink="/configuracion" routerLinkActive="active">
            <div class="barra"></div>
            <div class="foco">
                <i class="bi bi-gear"></i>
            </div>
        </div>
    </nav>

    <div class="areaTrabajo">
        <router-outlet></router-outlet>
    </div>
</div>
