<div class="catalogo-layout">
  <section class="panel">
    <h3 class="panel-title">Catálogos</h3>
    
    @for(catalogo of listaCatalogos; track $index) {
      <div class="catalogos" [class.selected]="catalogoSeleccionado === catalogo.titulo" (click)="seleccionarCatalogo(catalogo.titulo)">
        <div class="icono">
          <i class="{{ catalogo.icono }}"></i>
        </div>
        <div class="texto">
          <h3>{{ catalogo.titulo }}</h3>
          <p>{{ catalogo.descripcion }}</p>
        </div>
        <div class="cantidad">
          <h3>Registros</h3>
          <h4>{{ catalogo.cantidad }}</h4>
        </div>
      </div>
    }
    
  </section>

  <section class="panel panel_tabla">
    <div class="encabezado-registros">
      <h3 class="panel-title">{{ 'grupoSeleccionado.nombre' }}</h3>
      <div class="miniSub-container">
        <app-tab-switch
          [op1]="'Activos'"
          [op2]="'Inactivos'"
        >
        <!-- [mostrarActivos]="mostrarActivos"
          (opcionCambiada)="mostrarRegistros($event)" -->
        </app-tab-switch>
      </div>
    </div>

    <table class="table tabla-registros">
      <thead>
        <tr>
          <th class="celda_centrada">No.</th>
          <th class="celda_izquierda">Nombre</th>
          <th class="celda_izquierda">Abreviatura</th>
          <th class="celda_centrada">Acciones</th>
        </tr>
      </thead>

      <tbody>
        <tr>
          <td class="celda_centrada">1</td>
          <td class="celda_izquierda">Miligramos</td>
          <td class="celda_izquierda">ml</td>
          <td class="celda_centrada acciones">
            <button class="btn _editar">Editar</button>
            <button class="btn _eliminar">Desactivar</button>
          </td>
        </tr>
      </tbody>
      <tfoot>
        <tr>
          <td colspan="4"><app-paginacion></app-paginacion></td>
        </tr>
      </tfoot>
    </table>
     
  </section>

  <section class="panel panel_formulario">
    <h3 class=" titulo-formulario">{{ 'tituloFormulario' }}</h3>

    <div class="formulario-box">
      <label for="nombreRegistro" class="label">Nombre</label>
      <input
        id="nombreRegistro"
        type="text"
       
        name="nombreRegistro"
        placeholder="Ingrese nombre"
      >
        <!-- [(ngModel)]="registro.nombre"
        [disabled]="enProceso" -->

      <label for="abreviaturaRegistro" class="label">Abreviatura</label>
      <input
        id="abreviaturaRegistro"
        type="text"
        
        name="abreviaturaRegistro"
        placeholder="Ingrese abreviatura"
      >
        <!-- [(ngModel)]="registro.nombre"
        [disabled]="enProceso" -->

      <div class="acciones-formulario">
        <!-- [disabled]="enProceso" (click)="resetFormulario()" -->
        <button type="button" class="btn _cancelar" >
          Cancelar
        </button>
        <button
          type="button"
          class="btn _guardar"
        >
          <!-- [disabled]="!formularioValido || !hayCambiosEnEdicion || enProceso"
          (click)="modoEdicion ? actualizarRegistro() : guardarRegistro()" -->
          {{'Guardar' }}
        </button>
      </div>
    </div>
  </section>
</div>
