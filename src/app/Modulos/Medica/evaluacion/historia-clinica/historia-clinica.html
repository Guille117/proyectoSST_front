<!-- Historia clínica: cuadro del interrogatorio (sección de Evaluación clínica) -->
<section class="panel">
  <form class="historia-form" (ngSubmit)="guardarHistoria()">
    <label class="historia-label" for="historiaClinica">Historia clínica</label>

    <textarea
      id="historiaClinica"
      name="historiaClinica"
      class="historia-campo"
      [class.historia-campo--lectura]="soloLectura || !modoEdicion"
      [(ngModel)]="historiaClinica"
      [readonly]="soloLectura || !modoEdicion"
      [attr.aria-readonly]="soloLectura || !modoEdicion"
      [maxlength]="maxCaracteres"
      placeholder="Escribe la historia clínica del paciente..."
    ></textarea>

    <!-- Estado clínico del episodio: select del catálogo compartido, con opción "Otro" para crear uno nuevo -->
    <div class="historia-estado-clinico">
      <label class="historia-label" for="estadoClinico">Estado clínico</label>

      @if (mostrandoOtroEstado) {
        <app-opcion-otro
          #estadoOtro
          [placeholder]="'Escribe el estado clínico'"
          [creando]="creandoEstado"
          (confirmar)="crearEstadoClinico($event)"
          (cancelar)="cancelarEstadoClinico()"
        ></app-opcion-otro>
      } @else {
        <select
          class="historia-campo"
          id="estadoClinico"
          name="estadoClinico"
          [disabled]="soloLectura || !modoEdicion"
          [(ngModel)]="estadoClinicoValor"
          (ngModelChange)="alElegirEstadoClinico($event)"
        >
          <option value="" disabled>Seleccione el estado clínico</option>

          @for (estado of estadosClinico; track estado.id) {
            <option [value]="estado.id">{{ estado.nombre }}</option>
          }
          <option [value]="opcionOtroId">Otro</option>
        </select>
      }
    </div>

    <!-- Acciones del cuadro: sin historia registrada se captura directamente, por lo que "Editar"
         solo aparece cuando ya existe un registro que habilitar y "Cancelar" solo mientras se edita
         ese registro registrado, para descartar los cambios y volver al estado inicial -->
    @if (!soloLectura) {
    <div class="acciones-formulario historia-acciones">
      @if (modoEdicion && idHistoriaActual !== null) {
        <button
          type="button"
          class="btn _cancelar"
          [disabled]="cargando || guardando"
          (click)="cancelarEdicion()"
        >
          Cancelar
        </button>
      }
      @if (!modoEdicion && puedeGestionar(usuarioIdHistoriaActual)) {
        <button
          type="button"
          class="btn _editar"
          [disabled]="cargando || guardando"
          (click)="activarEdicion()"
        >
          Editar
        </button>
      }
      <button type="submit" class="btn _guardar" [disabled]="!modoEdicion || cargando || guardando">
        Guardar
      </button>
    </div>
    }
  </form>
</section>
