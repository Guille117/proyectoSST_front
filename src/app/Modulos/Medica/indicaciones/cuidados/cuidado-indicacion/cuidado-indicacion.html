<!-- Formulario del cuidado: el mismo del registro de indicaciones médicas, reutilizado en el
     tratamiento del alta médica. La pantalla que lo contiene decide cuándo mostrarlo. -->
<section class="panel" [attr.aria-labelledby]="mostrarTitulo ? 'tituloCuidadoTratamiento' : null">
  @if (mostrarTitulo) {
    <h3 class="panel-titulo indicacion-titulo" id="tituloCuidadoTratamiento">Cuidados</h3>
  }

  <!-- Cabecera de la pantalla que contiene el formulario: pestañas y acciones de la sección -->
  <ng-content select=".slot-cabecera"></ng-content>

  <form class="indicacion-form" (ngSubmit)="agregarCuidado()">
    <!-- Nombre del cuidado y su frecuencia: la frecuencia solo admite números -->
    <div class="indicacion-fila">
      <div class="indicacion-campo indicacion-campo--ancho">
        <label class="indicacion-etiqueta" for="nombreCuidadoTratamiento">
          Nombre de cuidado<span class="indicacion-obligatorio" aria-hidden="true">*</span>
        </label>
        <input
          class="indicacion-input"
          id="nombreCuidadoTratamiento"
          name="nombreCuidadoTratamiento"
          type="text"
          placeholder="Ej. Cambio de posición"
          maxlength="200"
          aria-required="true"
          [(ngModel)]="nombre"
        />
      </div>

      <div class="indicacion-campo">
        <label class="indicacion-etiqueta" for="frecuenciaCuidadoTratamiento">
          Frecuencia (horas)<span class="indicacion-obligatorio" aria-hidden="true">*</span>
        </label>
        <input
          class="indicacion-input"
          id="frecuenciaCuidadoTratamiento"
          name="frecuenciaCuidadoTratamiento"
          type="number"
          min="1"
          step="1"
          inputmode="numeric"
          placeholder="Ej. 8"
          aria-required="true"
          [(ngModel)]="frecuencia"
        />
      </div>
    </div>

    <!-- Duración, tipo de duración y observaciones -->
    <div class="indicacion-fila">
      <div class="indicacion-campo">
        <label class="indicacion-etiqueta" for="duracionCuidadoTratamiento">
          Duración
          @if (duracionTipo === 'dias') {
            <span class="indicacion-obligatorio" aria-hidden="true">*</span>
          }
        </label>
        <input
          class="indicacion-input"
          id="duracionCuidadoTratamiento"
          name="duracionCuidadoTratamiento"
          type="number"
          min="1"
          step="1"
          inputmode="numeric"
          placeholder="Ej. 7"
          [attr.aria-required]="duracionTipo === 'dias'"
          [(ngModel)]="duracionCantidad"
        />
      </div>

      <div class="indicacion-campo">
        <label class="indicacion-etiqueta" for="duracionTipoCuidadoTratamiento">
          Tipo de duración<span class="indicacion-obligatorio" aria-hidden="true">*</span>
        </label>
        <select
          class="indicacion-input"
          id="duracionTipoCuidadoTratamiento"
          name="duracionTipoCuidadoTratamiento"
          [(ngModel)]="duracionTipo"
        >
          <option value="">Seleccionar...</option>
          @for (opcion of tiposDuracion; track opcion.id) {
            <option [value]="opcion.id">{{ opcion.nombre }}</option>
          }
        </select>
      </div>

      <div class="indicacion-campo">
        <label class="indicacion-etiqueta" for="observacionesCuidadoTratamiento">
          Observaciones
        </label>
        <textarea
          class="indicacion-input indicacion-textarea"
          id="observacionesCuidadoTratamiento"
          name="observacionesCuidadoTratamiento"
          placeholder="Indicaciones adicionales..."
          maxlength="2000"
          [(ngModel)]="observaciones"
        ></textarea>
      </div>
    </div>

    <!-- Acciones del formulario -->
    <div class="acciones-formulario indicacion-acciones">
      <button type="button" class="btn _cancelar" (click)="cancelarCaptura()">Cancelar</button>
      <ng-content select=".slot-accion"></ng-content>
      <button type="submit" class="btn _guardar" [disabled]="!puedeGuardar">Guardar</button>
    </div>
  </form>
</section>
