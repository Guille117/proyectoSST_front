<div class="reporte areaTrabajo-container">
  <div class="reporte-encabezado">
    <h2 class="reporte-titulo">Vencimientos por mes/año</h2>
    <div class="filtros">
      <button type="button" class="btn" (click)="exportarPdf()">PDF</button>
      <button type="button" class="btn" (click)="exportarExcel()">Excel</button>
    </div>
  </div>

  @if (cargando) {
    <p class="reporte-vacio">Cargando reporte...</p>
  } @else {
    <div class="table-container">
      <table class="table">
        <thead>
          <tr>
            <th class="celda_izquierda">Producto</th>
            <th class="celda_centrada">Cantidad vencida</th>
            <th class="celda_centrada">Mes</th>
            <th class="celda_centrada">Año</th>
          </tr>
        </thead>
        <tbody>
          @for (v of datos; track $index) {
            <tr>
              <td class="celda_izquierda">{{ v.producto }}</td>
              <td class="celda_centrada">{{ v.cantidad }}</td>
              <td class="celda_centrada">{{ nombreMes(v.mes) }}</td>
              <td class="celda_centrada">{{ v.anio }}</td>
            </tr>
          } @empty {
            <tr>
              <td colspan="4" class="celda_centrada">Sin datos.</td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  }
</div>
