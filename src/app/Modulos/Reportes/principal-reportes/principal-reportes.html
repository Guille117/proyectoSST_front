<div class="principal">
  <aside class="reportes-menu" aria-label="Submenú de reportes">
    <div class="menu-titulo">
      <h1>Reportes</h1>
    </div>

    <nav class="menu-opciones" aria-label="Reportes disponibles">
      @for (grupo of grupos; track grupo.titulo) {
        @if (grupoVisible(grupo)) {
          <p class="menu-grupo-titulo">{{ grupo.titulo }}</p>

          @for (opcion of grupo.opciones; track opcion.ruta) {
            @if (permisos.puedeLeerSubmodulo(opcion.submodulo)) {
              <a
                class="menu-opcion"
                [routerLink]="opcion.ruta"
                routerLinkActive="menu-opcion--activa"
              >
                <span>{{ opcion.titulo }}</span>
              </a>
            }
          }

          <hr class="menu-separador" />
        }
      }
    </nav>
  </aside>

  <section class="reportes-detalle" aria-label="Reporte seleccionado">
    <router-outlet></router-outlet>
  </section>
</div>
