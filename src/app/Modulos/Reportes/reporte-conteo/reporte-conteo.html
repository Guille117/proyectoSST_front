<div class="reporte areaTrabajo-container">
  <div class="reporte-encabezado">
    <div class="filtros">
      <div class="filtro-fecha">
        <app-campo-validado [label]="'Desde'" [fieldId]="'desde'">
          <input type="date" id="desde" name="desde" [(ngModel)]="desde" />
        </app-campo-validado>
      </div>
      <div class="filtro-fecha">
        <app-campo-validado [label]="'Hasta'" [fieldId]="'hasta'">
          <input type="date" id="hasta" name="hasta" [(ngModel)]="hasta" />
        </app-campo-validado>
      </div>
      <button type="button" class="btn _principal" [disabled]="cargando" (click)="generar()">Generar</button>
      <button type="button" class="btn" (click)="exportarPdf()">PDF</button>
      <button type="button" class="btn" (click)="exportarExcel()">Excel</button>
    </div>
  </div>

  @if (cargando) {
    <p class="reporte-vacio">Cargando reporte...</p>
  } @else {
    <div class="table-container">
      <table class="table">
        <thead>
          <tr>
            <th class="celda_izquierda">{{ config.etiquetaColumna }}</th>
            <th class="celda_centrada">{{ config.etiquetaValor }}</th>
          </tr>
        </thead>
        <tbody>
          @for (d of datos; track d.nombre) {
            <tr>
              <td class="celda_izquierda">{{ d.nombre }}</td>
              <td class="celda_centrada">{{ d.cantidad }}</td>
            </tr>
          } @empty {
            <tr>
              <td colspan="2" class="celda_centrada">Sin datos.</td>
            </tr>
          }
        </tbody>
      </table>
    </div>

    @if (config.conGrafica && datos.length) {
      <div class="grafica">
        <app-grafica-barras
          [etiquetas]="etiquetas()"
          [valores]="valores()"
          [titulo]="config.graficaTitulo ?? config.titulo"
        ></app-grafica-barras>
      </div>
    }
  }
</div>
