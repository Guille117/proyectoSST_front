<div class="contenido">
    <div
        class="texto"
        [class.texto--alterno-primero]="alternoPrimero && !!textoAlterno"
    >
        @if (textoAlterno) {
            <!-- El recuento y el texto alterno comparten el sitio y se van turnando -->
            @if (alternoPrimero) {
                <span class="texto-alterno texto-alterno--intercalado">{{ textoAlterno }}</span>
                <span class="texto-alterno">{{ textoMostrando }}</span>
            } @else {
                <span class="texto-alterno">{{ textoMostrando }}</span>
                <span class="texto-alterno texto-alterno--intercalado">{{ textoAlterno }}</span>
            }
        } @else {
            {{ textoMostrando }}
        }
    </div>
    <nav>
        <button type="button" class="izquierda" [disabled]="paginaActual <= 1" (click)="paginaAnterior()">
            <i class="bi bi-chevron-left"></i>
        </button>
        <div class="pagina">{{ paginaActual }}</div>
        <button type="button" class="derecha" [disabled]="paginaActual >= totalPaginas" (click)="paginaSiguiente()">
            <i class="bi bi-chevron-right"></i>
        </button>
    </nav>
</div>
