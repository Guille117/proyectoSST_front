<div class="miniSubMenu" [class.deshabilitado]="disabled" [attr.aria-disabled]="disabled || null">
    <div [ngClass]="mostrarActivos ? 'op2' : 'op'" (click)="seleccionarOpcion(true)">
         {{op1}}
    </div>
    <div [ngClass]="mostrarActivos ? 'op' : 'op2'" (click)="seleccionarOpcion(false)">
        {{op2}}
    </div>
</div>
